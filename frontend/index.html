<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta
      name="description"
      content="NemuVibe - Temukan cafe terbaik di Purwokerto sesuai vibe-mu. Rekomendasi cerdas untuk WFC, Nongkrong, dan Ngedate."
    />
    <meta name="theme-color" content="#0047AB" />
    <title>NemuVibe — Temukan Vibe Cafe-mu</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div id="app" class="app-container">
      <!-- ===== HEADER ===== -->
      <header class="header" id="main-header">
        <div class="header-left">
          <svg
            class="header-logo-icon"
            width="28"
            height="28"
            viewBox="0 0 28 28"
            fill="none"
          >
            <circle cx="14" cy="14" r="14" fill="#0047AB" />
            <path
              d="M14 6C10.134 6 7 9.134 7 13c0 2.76 1.6 5.14 3.92 6.28L14 22l3.08-2.72C19.4 18.14 21 15.76 21 13c0-3.866-3.134-7-7-7z"
              fill="#FFD700"
            />
            <circle cx="14" cy="13" r="2.5" fill="#0047AB" />
          </svg>
          <span class="header-logo-text">NemuVibe</span>
        </div>
        <div class="header-right">
          <button class="info-btn" id="info-btn" aria-label="Tentang Kami">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
              <circle
                cx="12"
                cy="12"
                r="10"
                stroke="#0047AB"
                stroke-width="2"
                fill="none"
              />
              <text
                x="12"
                y="17"
                text-anchor="middle"
                font-size="14"
                font-weight="700"
                fill="#0047AB"
                font-family="Plus Jakarta Sans, sans-serif"
              >
                i
              </text>
            </svg>
          </button>
        </div>
      </header>

      <!-- ===== MAIN CONTENT ===== -->
      <main class="main-content" id="main-content">
        <!-- Hero Section -->
        <section class="hero-section" id="hero-section">
          <h1 class="hero-headline">
            Pilih Vibe-mu,<br />
            <span class="hero-headline-accent">Temukan Tempatmu.</span>
          </h1>
          <p class="hero-subtitle">
            Rekomendasi kafe terbaik di sekitar Purwokerto.
          </p>

          <!-- Search Bar -->
          <div class="search-bar" id="search-bar">
            <svg
              class="search-icon"
              width="20"
              height="20"
              viewBox="0 0 20 20"
              fill="none"
            >
              <circle
                cx="8.5"
                cy="8.5"
                r="6"
                stroke="#9CA3AF"
                stroke-width="2"
              />
              <path
                d="M13 13L18 18"
                stroke="#9CA3AF"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
            <input
              type="text"
              class="search-input"
              id="search-input"
              placeholder="Cari kafe, kopi, atau vibe..."
            />
            <button
              class="search-filter-btn"
              id="search-filter-btn"
              aria-label="Filter"
            >
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                <path
                  d="M2 4h14M5 9h8M7 14h4"
                  stroke="white"
                  stroke-width="2"
                  stroke-linecap="round"
                />
              </svg>
            </button>
          </div>
        </section>

        <!-- Vibe Category Section -->
        <section class="vibe-section" id="vibe-section">
          <h2 class="section-label">Mau ngapain hari ini?</h2>
          <div class="vibe-cards">
            <!-- WFC Card -->
            <button class="vibe-card" id="vibe-wfc" data-category="wfc">
              <div class="vibe-icon vibe-icon--wfc">
                <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                  <rect
                    x="4"
                    y="6"
                    width="20"
                    height="13"
                    rx="2"
                    stroke="#0047AB"
                    stroke-width="2"
                    fill="none"
                  />
                  <path
                    d="M8 22h12"
                    stroke="#0047AB"
                    stroke-width="2"
                    stroke-linecap="round"
                  />
                  <path
                    d="M14 19v3"
                    stroke="#0047AB"
                    stroke-width="2"
                    stroke-linecap="round"
                  />
                </svg>
              </div>
              <span class="vibe-label">WFC</span>
            </button>

            <!-- Nongkrong Card -->
            <button
              class="vibe-card"
              id="vibe-nongkrong"
              data-category="nongkrong"
            >
              <div class="vibe-icon vibe-icon--nongkrong">
                <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                  <path
                    d="M6 12h12v2a6 6 0 01-6 6h0a6 6 0 01-6-6v-2z"
                    stroke="#B8860B"
                    stroke-width="2"
                    fill="none"
                  />
                  <path
                    d="M18 13h1a3 3 0 010 6h-1"
                    stroke="#B8860B"
                    stroke-width="2"
                    fill="none"
                  />
                  <path
                    d="M8 22h8"
                    stroke="#B8860B"
                    stroke-width="2"
                    stroke-linecap="round"
                  />
                  <path
                    d="M9 7c0-2 1.5-2 1.5-4"
                    stroke="#B8860B"
                    stroke-width="1.5"
                    stroke-linecap="round"
                  />
                  <path
                    d="M12 7c0-2 1.5-2 1.5-4"
                    stroke="#B8860B"
                    stroke-width="1.5"
                    stroke-linecap="round"
                  />
                  <path
                    d="M15 7c0-2 1.5-2 1.5-4"
                    stroke="#B8860B"
                    stroke-width="1.5"
                    stroke-linecap="round"
                  />
                </svg>
              </div>
              <span class="vibe-label">Nongkrong</span>
            </button>

            <!-- Ngedate Card -->
            <button class="vibe-card" id="vibe-ngedate" data-category="ngedate">
              <div class="vibe-icon vibe-icon--ngedate">
                <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                  <path
                    d="M14 24s-8-5.5-8-11a5 5 0 0110 0 5 5 0 0110 0c0 5.5-8 11-8 11h-4z"
                    fill="none"
                    stroke="#E91E63"
                    stroke-width="2"
                  />
                  <path
                    d="M14 24s-7-5-7-10.5a4.5 4.5 0 019 0 4.5 4.5 0 019 0C25 19 14 24 14 24z"
                    fill="#FCE4EC"
                  />
                  <path
                    d="M14 23s-6-4.5-6-9.5a3.8 3.8 0 017.6 0h0a3.8 3.8 0 017.6 0c0 5-6 9.5-6 9.5"
                    fill="none"
                    stroke="#E91E63"
                    stroke-width="1.5"
                  />
                </svg>
              </div>
              <span class="vibe-label">Ngedate</span>
            </button>
          </div>
        </section>

        <!-- Recommendations Section -->
        <section class="reco-section" id="reco-section">
          <div class="reco-header">
            <h2 class="section-title">Rekomendasi Teratas</h2>
            <button class="see-all-btn" id="see-all-btn">Lihat Semua</button>
          </div>

          <!-- Loading Skeleton -->
          <div class="reco-loading" id="reco-loading">
            <div class="skeleton-card">
              <div class="skeleton-image shimmer"></div>
              <div class="skeleton-body">
                <div class="skeleton-line skeleton-line--title shimmer"></div>
                <div class="skeleton-line skeleton-line--text shimmer"></div>
                <div class="skeleton-line skeleton-line--tags shimmer"></div>
              </div>
            </div>
            <div class="skeleton-card">
              <div class="skeleton-image shimmer"></div>
              <div class="skeleton-body">
                <div class="skeleton-line skeleton-line--title shimmer"></div>
                <div class="skeleton-line skeleton-line--text shimmer"></div>
                <div class="skeleton-line skeleton-line--tags shimmer"></div>
              </div>
            </div>
          </div>

          <!-- Dynamic Cards Container -->
          <div class="reco-list" id="reco-list"></div>

          <!-- Error State -->
          <div class="reco-error" id="reco-error" style="display:none;">
            <p>⚠️ Gagal memuat data. <button class="retry-btn" id="retry-btn">Coba Lagi</button></p>
          </div>
        </section>

        <!-- Spacer for bottom nav -->
        <div class="bottom-spacer"></div>
      </main>

      <!-- ===== BOTTOM NAVIGATION ===== -->
      <nav class="bottom-nav" id="bottom-nav">
        <button
          class="nav-item nav-item--active"
          id="nav-home"
          aria-label="Beranda"
        >
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
            <path
              d="M3 8.5L11 2l8 6.5V19a1.5 1.5 0 01-1.5 1.5h-13A1.5 1.5 0 013 19V8.5z"
              fill="currentColor"
            />
            <path d="M8 20.5v-6h6v6" stroke="white" stroke-width="1.5" />
          </svg>
          <span class="nav-label">Beranda</span>
        </button>

        <button class="nav-item" id="nav-ranking" aria-label="Peringkat">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
            <rect
              x="2"
              y="12"
              width="5"
              height="8"
              rx="1"
              fill="currentColor"
            />
            <rect
              x="8.5"
              y="6"
              width="5"
              height="14"
              rx="1"
              fill="currentColor"
            />
            <rect
              x="15"
              y="9"
              width="5"
              height="11"
              rx="1"
              fill="currentColor"
            />
            <path
              d="M11 2l1 2.5h2.5l-2 1.5.8 2.5L11 7l-2.3 1.5.8-2.5-2-1.5H10L11 2z"
              fill="currentColor"
            />
          </svg>
          <span class="nav-label">Peringkat</span>
        </button>

        <button
          class="nav-item nav-item--center"
          id="nav-search"
          aria-label="Cari"
        >
          <div class="nav-center-circle">
            <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
              <circle
                cx="9.5"
                cy="9.5"
                r="6.5"
                stroke="white"
                stroke-width="2.5"
              />
              <path
                d="M14.5 14.5L20 20"
                stroke="white"
                stroke-width="2.5"
                stroke-linecap="round"
              />
            </svg>
          </div>
          <span class="nav-label nav-label--center">Cari</span>
        </button>

        <button
          class="nav-item nav-item--locked"
          id="nav-saved"
          aria-label="Disimpan (Perlu Login)"
        >
          <div class="nav-icon-locked-wrap">
            <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
              <path
                d="M11 19s-7-4.5-7-10a4.5 4.5 0 019 0 4.5 4.5 0 019 0c0 5.5-7 10-7 10h-4z"
                fill="currentColor"
              />
            </svg>
            <div class="lock-badge">
              <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
                <rect
                  x="1.5"
                  y="4.5"
                  width="7"
                  height="5"
                  rx="1"
                  fill="white"
                />
                <path
                  d="M3 4.5V3a2 2 0 014 0v1.5"
                  stroke="white"
                  stroke-width="1"
                  fill="none"
                />
              </svg>
            </div>
          </div>
          <span class="nav-label">Disimpan</span>
        </button>

        <button
          class="nav-item nav-item--locked"
          id="nav-profile"
          aria-label="Profil (Perlu Login)"
        >
          <div class="nav-icon-locked-wrap">
            <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
              <circle cx="11" cy="8" r="4" fill="currentColor" />
              <path d="M3 20c0-4 3.5-7 8-7s8 3 8 7" fill="currentColor" />
            </svg>
            <div class="lock-badge">
              <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
                <rect
                  x="1.5"
                  y="4.5"
                  width="7"
                  height="5"
                  rx="1"
                  fill="white"
                />
                <path
                  d="M3 4.5V3a2 2 0 014 0v1.5"
                  stroke="white"
                  stroke-width="1"
                  fill="none"
                />
              </svg>
            </div>
          </div>
          <span class="nav-label">Profil</span>
        </button>
      </nav>
    </div>

    <script src="index.js"></script>
  </body>
</html>
